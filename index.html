<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapAl.az — Elanlar və Online Mağazalar</title>
    <style>
        :root {
            --primary: #ff4f00; /* Tap.az / Lalafo narıncı üslub */
            --primary-hover: #e04600;
            --success: #25d366;
            --bg: #f2f4f5;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-muted: #7f8c8d;
        }
        body {
            font-family: Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #ffffff;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 24px; font-weight: bold; color: var(--primary); text-decoration: none; }
        .nav-buttons button {
            background: var(--primary); color: white; border: none; padding: 10px 15px; 
            border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 10px;
        }
        
        .main-container { max-width: 1000px; margin: 20px auto; padding: 0 15px; }
        
        /* Kateqoriyalar */
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 25px; }
        .cat-btn { background: white; border: 1px solid #dcdde1; padding: 10px 20px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: bold; }
        .cat-btn:hover, .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* Elanlar Şəbəkəsi */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .card { background: var(--card-bg); border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; transition: 0.2s; }
        .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 180px; object-fit: cover; background: #e1b12c10; }
        .card-body { padding: 12px; }
        .price { font-size: 18px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; }
        .title { font-size: 14px; color: #34495e; height: 36px; overflow: hidden; margin-bottom: 10px; }
        .shop-badge { font-size: 11px; background: #eee; padding: 3px 6px; border-radius: 4px; color: var(--text-muted); }

        /* Modal / Formlar */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 400px; box-sizing: border-box; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .close-btn { background: #7f8c8d; color: white; width: 100%; padding: 12px; border: none; border-radius: 6px; margin-top: 10px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <a href="#" class="logo" onclick="filterCategory('all')">👑 TapAl.az</a>
        <div class="nav-buttons">
            <button onclick="toggleModal('shopModal', true)" style="background:#2c3e50;">🏪 Mağaza Aç</button>
            <button onclick="openAddProductModal()">➕ Yeni Elan</button>
        </div>
    </div>
</header>

<div class="main-container">
    <div class="categories">
        <button class="cat-btn active" id="cat-all" onclick="filterCategory('all')">Bütün Elanlar</button>
        <button class="cat-btn" id="cat-elek" onclick="filterCategory('Elektronika')">📱 Elektronika</button>
        <button class="cat-btn" id="cat-geyim" onclick="filterCategory('Geyim')">👕 Geyim</button>
        <button class="cat-btn" id="cat-avto" onclick="filterCategory('Avto')">🚗 Avto</button>
        <button class="cat-btn" id="cat-emlak" onclick="filterCategory('Əmlak')">🏠 Əmlak</button>
    </div>

    <h2 id="viewTitle" style="margin-bottom: 20px; font-size: 22px;">Son Əlavə Edilənlər</h2>
    <div class="grid" id="mainGrid"></div>
</div>

<div class="modal" id="shopModal">
    <div class="modal-content">
        <h3>🏪 Öz Online Mağazanı Qur</h3>
        <div class="form-group">
            <label>Mağaza / Brend Adı:</label>
            <input type="text" id="newShopName" placeholder="Məs: Baku Electronics">
        </div>
        <div class="form-group">
            <label>WhatsApp Nömrəniz:</label>
            <input type="text" id="newShopPhone" placeholder="Məs: 994501234567">
        </div>
        <button onclick="createShop()" style="width:100%; padding:12px; background:var(--primary); color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Mağazanı Aktiv Et</button>
        <button class="close-btn" onclick="toggleModal('shopModal', false)">Geri</button>
    </div>
</div>

<div class="modal" id="productModal">
    <div class="modal-content">
        <h3>➕ Yeni Elan Yerləşdir</h3>
        <div class="form-group">
            <label>Məhsulun Adı:</label>
            <input type="text" id="pName" placeholder="Məs: iPhone 15 Pro Max">
        </div>
        <div class="form-group">
            <label>Qiymət (AZN):</label>
            <input type="number" id="pPrice" placeholder="Məs: 2500">
        </div>
        <div class="form-group">
            <label>Kateqoriya:</label>
            <select id="pCategory">
                <option value="Elektronika">📱 Elektronika</option>
                <option value="Geyim">👕 Geyim</option>
                <option value="Avto">🚗 Avto</option>
                <option value="Əmlak">🏠 Əmlak</option>
            </select>
        </div>
        <div class="form-group">
            <label>Məhsul Şəkli (Şəkil Linki - Boş qala bilər):</label>
            <input type="text" id="pImg" placeholder="https://site.com/shekil.jpg">
        </div>
        <button onclick="submitProduct()" style="width:100%; padding:12px; background:#25d366; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Elanı Yayımla</button>
        <button class="close-btn" onclick="toggleModal('productModal', false)">Geri</button>
    </div>
</div>

<script>
    let currentCategory = 'all';

    // Defolt (Hazır) elanlar bazası (Sayt boş görünməsin deyə Lalafo üslubunda)
    const defaultProducts = [
        { id: 1, name: "iPhone 14 Pro, 256 GB", price: 1750, category: "Elektronika", img: "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?w=500", shop: "TapAl Rəsmi", phone: "994501234567" },
        { id: 2, name: "Oversize Nike Hoodie", price: 65, category: "Geyim", img: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500", shop: "TrendGeyim", phone: "994501234567" },
        { id: 3, name: "BMW F30 Sükan çarxı", price: 400, category: "Avto", img: "https://images.unsplash.com/photo-1542282088-fe8426682b8f?w=500", shop: "Autostore", phone: "994501234567" },
        { id: 4, name: "2 Otaqlı Mənzil, Nərimanov r.", price: 145000, category: "Əmlak", img: "https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?w=500", shop: "Evim Real Estate", phone: "994501234567" }
    ];

    window.onload = function() {
        if (!localStorage.getItem('global_ads')) {
            localStorage.setItem('global_ads', JSON.stringify(defaultProducts));
        }
        renderGrid();
    }

    function toggleModal(id, show) {
        document.getElementById(id).style.display = show ? "flex" : "none";
    }

    function openAddProductModal() {
        let activeShop = localStorage.getItem('my_active_shop');
        if (!activeShop) {
            alert("Elan yerləşdirmək üçün əvvəlcə 'Mağaza Aç' düyməsindən qeydiyyatdan keçməlisiniz!");
            toggleModal('shopModal', true);
            return;
        }
        toggleModal('productModal', true);
    }

    function createShop() {
        let sName = document.getElementById('newShopName').value.trim();
        let sPhone = document.getElementById('newShopPhone').value.trim();
        if(!sName || !sPhone) { alert("Xanaları doldurun!"); return; }
        
        localStorage.setItem('my_active_shop', sName);
        localStorage.setItem('my_active_phone', sPhone);
        
        alert(`Təbriklər! '${sName}' mağazanız uğurla açıldı. İndi elan yerləşdirə bilərsiniz.`);
        toggleModal('shopModal', false);
    }

    function submitProduct() {
        let name = document.getElementById('pName').value.trim();
        let price = document.getElementById('pPrice').value.trim();
        let cat = document.getElementById('pCategory').value;
        let img = document.getElementById('pImg').value.trim() || "https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500";
        
        if(!name || !price) { alert("Məhsul adı və qiymət mütləqdir!"); return; }

        let shopName = localStorage.getItem('my_active_shop');
        let shopPhone = localStorage.getItem('my_active_phone');

        let allAds = JSON.parse(localStorage.getItem('global_ads'));
        allAds.unshift({
            id: Date.now(),
            name: name,
            price: price,
            category: cat,
            img: img,
            shop: shopName,
            phone: shopPhone
        });

        localStorage.setItem('global_ads', JSON.stringify(allAds));
        
        // Formu sıfırla və bağla
        document.getElementById('pName').value = "";
        document.getElementById('pPrice').value = "";
        document.getElementById('pImg').value = "";
        toggleModal('productModal', false);
        
        renderGrid();
    }

    function filterCategory(category) {
        currentCategory = category;
        
        // Aktiv düymə rəngini tənzimlə
        document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
        if(category === 'all') document.getElementById('cat-all').classList.add('active');
        if(category === 'Elektronika') document.getElementById('cat-elek').classList.add('active');
        if(category === 'Geyim') document.getElementById('cat-geyim').classList.add('active');
        if(category === 'Avto') document.getElementById('cat-avto').classList.add('active');
        if(category === 'Əmlak') document.getElementById('cat-emlak').classList.add('active');

        renderGrid();
    }

    function renderGrid() {
        let allAds = JSON.parse(localStorage.getItem('global_ads')) || [];
        let grid = document.getElementById('mainGrid');
        grid.innerHTML = "";

        let filtered = allAds.filter(ad => currentCategory === 'all' || ad.category === currentCategory);

        if(filtered.length === 0) {
            grid.innerHTML = "<p style='grid-column: 1/-1; text-align:center; color:var(--text-muted);'>Bu kateqoriyada hələ elan yoxdur.</p>";
            return;
        }

        filtered.forEach(ad => {
            let msg = encodeURIComponent(`Salam, TapAl.az saytında gördüyüm bu məhsulla bağlı yazmaq istəyirəm:\n📦 Məhsul: ${ad.name}\n💰 Qiymət: ${ad.price} AZN`);
            let wsUrl = `https://wa.me/${ad.phone}?text=${msg}`;

            grid.innerHTML += `
                <div class="card">
                    <img src="${ad.img}" onerror="this.src='https://images.unsplash.com/photo-1531403009284-440f080d1e12?w=500'">
                    <div class="card-body">
                        <div class="price">${ad.price} AZN</div>
                        <div class="title">${ad.name}</div>
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
                            <span class="shop-badge">🏪 ${ad.shop}</span>
                            <a href="${wsUrl}" target="_blank" style="background:#25d366; color:white; padding:5px 10px; border-radius:6px; font-size:12px; text-decoration:none; font-weight:bold;">Sifariş 💬</a>
                        </div>
                    </div>
                </div>
            `;
        });
    }
</script>
</body>
</html>
